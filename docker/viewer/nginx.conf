# Serves the read-only sites built by tools/viewer.py (mounted at /usr/share/nginx/html):
# /main/, /branch/<name>/, /pr/<n>/ and the list at /refs/. Static files only, nothing writable.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # the container listens on 80 but is published on another port: redirect relative
    absolute_redirect off;

    # main is the default
    location = / {
        return 302 /main/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
