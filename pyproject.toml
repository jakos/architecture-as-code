[project]
name = "architecture-as-code"
description = "Tooling for C4 architecture-as-code with LikeC4"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "prek>=0.5.5",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false     # tooling is run, not installed; nothing to build

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
