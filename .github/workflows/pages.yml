# Publishes the LikeC4 site of examples/shop to GitHub Pages (ADR 0010).
# - Pages must be enabled with source "GitHub Actions" (an owner step in repo settings).
# - /editor/ on the Pages site is the editor demo (ADR 0011). The app takes about 11 minutes to
#   build (`just editor-demo-app`), so build/editor-demo-app is cached on a hash of what goes into
#   it; a model change only re-runs `just editor-demo-assemble`, which writes workspace.json and
#   must run after `just pages-build` because that replaces the whole build/pages directory.
# - Pull requests build the site only; the artifact upload and the deploy run on main.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: extractions/setup-just@v4
      - name: Build the site
        run: just pages-build HEAD
      - name: Check the site was built
        run: test -f build/pages/index.html
      - name: Restore the editor demo app
        id: demo-cache
        uses: actions/cache@v6
        with:
          path: build/editor-demo-app
          key: editor-demo-app-${{ hashFiles('docker/editor/model-editor/Containerfile', 'docker/editor/model-editor/patches/**', 'tools/editor_demo.py', 'tools/viewer.py', 'tools/third_party_notices.py', 'justfile', 'LICENSE') }}
      - name: Build the editor demo app
        if: steps.demo-cache.outputs.cache-hit != 'true'
        run: just editor-demo-app
      - name: Add the editor demo to the site
        run: just editor-demo-assemble HEAD
      - name: Check the editor demo was built
        run: test -f build/pages/editor/index.html && test -f build/pages/editor/workspace.json && test -s build/pages/editor/THIRD-PARTY-NOTICES.txt
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
