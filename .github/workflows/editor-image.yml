# Releases LikeC4 Model Editor (docker/editor/model-editor) as ghcr.io/jakos/likec4-model-editor
# (ADR 0012).
# - Pushing the git tag likec4-model-editor-vX.Y.Z is the release: the image gets the tags X.Y.Z
#   (immutable) and X.Y (newest patch of the minor). No `latest`. The image has its own semantic
#   version; the LikeC4 version it is built on is an image label, not part of the version.
# - The release job refuses a tag that is not on main, a version that is already in the
#   registry, and an older patch than one already tagged for the same X.Y (the moving X.Y tag
#   would go back). A registry error other than "not found" fails the job; it is never read as
#   "not released". It logs in with the workflow's own GITHUB_TOKEN; there is no stored credential.
# - A package created by a workflow push starts private; making it public is an owner setting
#   (package settings on GitHub), not done here.
# - Pull requests that touch the image only build it and check it; they do not log in or push.
#   The build takes about 11 minutes.
# - Both jobs check that git can reach GitHub over HTTPS inside the image (`git ls-remote`,
#   anonymous), because 0.1.0 shipped without CA certificates.
name: editor-image

on:
  push:
    tags: ['likec4-model-editor-v*']
  pull_request:
    paths:
      - docker/editor/model-editor/Containerfile
      - docker/editor/model-editor/patches/**
      - docker/editor/entrypoint.py
      - tools/web_editor.py
      - tools/submit.py
      - tools/model_source.py
      - tools/poc_remote.py
      - tools/editor_release.py
      - tools/third_party_notices.py
      - LICENSE
      - .github/workflows/editor-image.yml

permissions:
  contents: read

env:
  CONTAINERFILE: docker/editor/model-editor/Containerfile
  STATIC: /usr/local/share/model-editor
  HTTPS_CHECK_URL: https://github.com/jakos/architecture-as-code.git

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -f "$CONTAINERFILE" -t editor-image-check .
      - name: Check the labels
        run: |
          docker image inspect --format '{{json .Config.Labels}}' editor-image-check
          docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.title"}}' editor-image-check | grep -qx 'LikeC4 Model Editor'
          docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' editor-image-check | grep -qx 'https://github.com/jakos/architecture-as-code'
          docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}' editor-image-check | grep -qx 'MIT'
          docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.description"}}' editor-image-check | grep -q '^Edit a LikeC4 architecture model in the browser'
          docker image inspect --format '{{index .Config.Labels "io.github.jakos.architecture-as-code.likec4-version"}}' editor-image-check | grep -q '1\.'
      - name: Check the licence files, the notices and the app name
        run: >
          docker run --rm --entrypoint sh editor-image-check -c
          "test -f $STATIC/LICENSE-LikeC4.txt && test -f $STATIC/LICENSE.txt && test -s $STATIC/THIRD-PARTY-NOTICES.txt && test -s $STATIC/THIRD-PARTY-NOTICES-likec4-cli.txt && grep -q '^Package: react@' $STATIC/THIRD-PARTY-NOTICES.txt && grep -q '<title>LikeC4 Model Editor</title>' $STATIC/index.html"
      - name: Check git over HTTPS
        run: docker run --rm --entrypoint git editor-image-check ls-remote "$HTTPS_CHECK_URL" HEAD

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/likec4-model-editor-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Check the tagged commit is on main
        run: |
          git fetch --tags --force origin
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main; releases are made from main only"; exit 1; }
      - name: Map the tag to the image version and tags
        id: release
        run: |
          # unquoted on purpose: one argument per release tag (they contain no spaces)
          uv run --locked python tools/editor_release.py tags "$GITHUB_REF_NAME" --released $(git tag --list 'likec4-model-editor-v*') >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Refuse a version that is already released
        env:
          REF: ${{ steps.release.outputs.ref }}
        run: |
          set +e
          out=$(docker manifest inspect "$REF" 2>&1)
          rc=$?
          set -e
          printf '%s' "$out" | uv run --locked python tools/editor_release.py check-unreleased "$REF" --inspect-exit "$rc" || { echo "::error::cannot release $REF; see the line above"; exit 1; }
      - name: Build the image
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAGS: ${{ steps.release.outputs.tags }}
        run: |
          tag_args=""
          for t in $TAGS; do tag_args="$tag_args -t $t"; done
          docker build -f "$CONTAINERFILE" --build-arg "IMAGE_VERSION=$VERSION" $tag_args .
      - name: Check the labels
        env:
          REF: ${{ steps.release.outputs.ref }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker image inspect --format '{{json .Config.Labels}}' "$REF"
          docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.title"}}' "$REF" | grep -qx 'LikeC4 Model Editor'
          docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$REF" | grep -qx 'https://github.com/jakos/architecture-as-code'
          docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}' "$REF" | grep -qx 'MIT'
          docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.description"}}' "$REF" | grep -q '^Edit a LikeC4 architecture model in the browser'
          docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$REF" | grep -qx "$VERSION"
          docker image inspect --format '{{index .Config.Labels "io.github.jakos.architecture-as-code.likec4-version"}}' "$REF" | grep -q '1\.'
      - name: Check the licence files, the notices and the app name
        env:
          REF: ${{ steps.release.outputs.ref }}
        run: >
          docker run --rm --entrypoint sh "$REF" -c
          "test -f $STATIC/LICENSE-LikeC4.txt && test -f $STATIC/LICENSE.txt && test -s $STATIC/THIRD-PARTY-NOTICES.txt && test -s $STATIC/THIRD-PARTY-NOTICES-likec4-cli.txt && grep -q '^Package: react@' $STATIC/THIRD-PARTY-NOTICES.txt && grep -q '<title>LikeC4 Model Editor</title>' $STATIC/index.html"
      - name: Check git over HTTPS
        env:
          REF: ${{ steps.release.outputs.ref }}
        run: docker run --rm --entrypoint git "$REF" ls-remote "$HTTPS_CHECK_URL" HEAD
      - name: Publish the tags
        env:
          TAGS: ${{ steps.release.outputs.tags }}
        run: |
          for t in $TAGS; do docker push "$t"; done
