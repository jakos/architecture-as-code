default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  # A blank context line in a patch is a single space; stripping it breaks the patch.
  { id = "trailing-whitespace", exclude = '\.patch$' },
  { id = "end-of-file-fixer", exclude = '\.patch$' },
  { id = "check-yaml" },
  { id = "check-added-large-files" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
language = "system"
entry = "uv run --locked ruff check --fix"
types = ["python"]

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
language = "system"
entry = "uv run --locked ruff format"
types = ["python"]

[[repos.hooks]]
id = "pytest"
name = "pytest"
language = "system"
entry = "uv run --locked pytest -q"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos.hooks]]
id = "likec4-validate"
name = "likec4 validate"
language = "system"
entry = "uv run --locked python tools/validate_models.py"
pass_filenames = false
files = '(\.c4|likec4\.config\.json)$'
stages = ["pre-push"]
